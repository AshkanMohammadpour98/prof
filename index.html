<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اشکان محمدپور | کارت ویزیت دیجیتال</title>
<meta name="description" content="کارت ویزیت دیجیتال اشکان محمدپور، وب‌دولوپر — راه‌های تماس، شبکه‌های اجتماعی و ذخیره مخاطب در یک صفحه.">
<meta name="theme-color" content="#14130F">

<meta property="og:type" content="profile">
<meta property="og:title" content="اشکان محمدپور | کارت ویزیت دیجیتال">
<meta property="og:description" content="راه‌های تماس، شبکه‌های اجتماعی و ذخیره مخاطب در یک صفحه.">
<meta property="og:image" content="assets/profile.jpg">
<meta property="og:url" content="https://example.com/card">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪪</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="scene" aria-hidden="true">
  <span class="glow glow--a"></span>
  <span class="glow glow--b"></span>
</div>

<main class="card" id="card">

  <!-- بخش ۱: پروفایل -->
  <section class="hero reveal" style="--d:0">
    <div class="hero__avatar">
      <img src="assets/profile.svg" alt="تصویر پروفایل اشکان محمدپور" width="112" height="112">
      <span class="hero__status" role="status">
        <span class="hero__dot"></span>
        آماده همکاری
      </span>
    </div>
    <h1 class="hero__name">اشکان محمدپور</h1>
    <p class="hero__title">طراح و توسعه‌دهنده وب</p>
    <p class="hero__bio">می‌سازم تا وب‌سایت‌ها سریع، تمیز و به‌یادماندنی باشند — با تمرکز روی تجربه‌ی کاربر و جزئیات کوچک.</p>
  </section>

  <div class="divider reveal" style="--d:1" aria-hidden="true"></div>

  <!-- بخش ۲: اطلاعات تماس -->
  <section class="info reveal" style="--d:2" aria-label="اطلاعات تماس">
    <a class="info__row" id="row-phone" href="#">
      <span class="info__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4.7c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </span>
      <span class="info__text">
        <span class="info__label">تماس مستقیم</span>
        <span class="info__value" id="val-phone">—</span>
      </span>
    </a>

    <a class="info__row" id="row-email" href="#">
      <span class="info__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12H4V6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m4.5 6.5 7.5 6 7.5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="info__text">
        <span class="info__label">ایمیل</span>
        <span class="info__value" id="val-email">—</span>
      </span>
    </a>

    <a class="info__row" id="row-address" href="#" target="_blank" rel="noopener noreferrer">
      <span class="info__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>
      </span>
      <span class="info__text">
        <span class="info__label">آدرس</span>
        <span class="info__value" id="val-address">—</span>
      </span>
    </a>

    <a class="info__row info__row--last" id="row-website" href="#" target="_blank" rel="noopener noreferrer">
      <span class="info__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.3 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.3-3.6-8.5S9.6 5.8 12 3.5Z" stroke="currentColor" stroke-width="1.6"/></svg>
      </span>
      <span class="info__text">
        <span class="info__label">وب‌سایت</span>
        <span class="info__value" id="val-website">—</span>
      </span>
    </a>
  </section>

  <!-- بخش ۳: دکمه‌های ارتباطی -->
  <section class="actions reveal" style="--d:3" aria-label="راه‌های ارتباطی">
    <a class="btn btn--primary" id="btn-call" href="#">
      <span class="btn__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4.7c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </span>
      <span class="btn__text">
        <span class="btn__title">تماس بگیرید</span>
        <span class="btn__subtitle">پاسخ‌گویی سریع در ساعات کاری</span>
      </span>
    </a>

    <div class="actions__row">
      <a class="btn btn--outline" id="btn-whatsapp" href="#" target="_blank" rel="noopener noreferrer">
        <span class="btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5a8.5 8.5 0 0 0-7.3 12.8L3.5 20.5l4.3-1.1A8.5 8.5 0 1 0 12 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.7 8.6c.2-.5.5-.5.8-.5h.5c.2 0 .4 0 .6.4.2.5.6 1.5.7 1.6.1.1.1.3 0 .5-.1.2-.2.3-.3.5-.2.2-.3.3-.1.6.6 1 1.3 1.6 2.2 2 .2.1.4.1.5-.1l.5-.6c.2-.2.3-.2.5-.1l1.3.6c.2.1.3.2.3.4 0 .8-.3 1.5-1.1 1.8-.6.3-1.3.3-2.4-.1-1.8-.6-3.1-2-4-3.9-.4-.9-.3-1.6.2-2.2Z" fill="currentColor"/></svg>
        </span>
        <span class="btn__text"><span class="btn__title">واتساپ</span></span>
      </a>
      <a class="btn btn--outline" id="btn-telegram" href="#" target="_blank" rel="noopener noreferrer">
        <span class="btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3.5 12.4 19.8 5.9c.7-.3 1.4.3 1.1 1l-2.8 12.9c-.2.9-1.2 1.2-1.9.6l-3.7-2.9-1.9 1.8c-.2.2-.5.3-.8.1l.3-3.4 6.6-6-8 5-3.4-1c-.8-.2-.8-1.2.2-1.6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </span>
        <span class="btn__text"><span class="btn__title">تلگرام</span></span>
      </a>
    </div>

    <a class="btn btn--outline btn--full" id="btn-map" href="#" target="_blank" rel="noopener noreferrer">
      <span class="btn__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>
      </span>
      <span class="btn__text"><span class="btn__title">نمایش روی نقشه</span></span>
    </a>

    <button class="btn btn--ghost btn--full" id="btn-save" type="button">
      <span class="btn__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span class="btn__text"><span class="btn__title">ذخیره در مخاطبین</span></span>
    </button>
  </section>

  <div class="divider reveal" style="--d:4" aria-hidden="true"></div>

  <!-- بخش ۴: شبکه‌های اجتماعی -->
  <section class="social reveal" style="--d:5" aria-label="شبکه‌های اجتماعی" id="social-list">
    <!-- با جاوااسکریپت پر می‌شود -->
  </section>

  <!-- Footer -->
  <footer class="footer reveal" style="--d:6">
    <p>کارت ویزیت دیجیتال · ۲۰۲۶</p>
  </footer>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
